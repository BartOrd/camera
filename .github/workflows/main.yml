name: Build Camera
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test RTSP request parser
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude -Iproject/example/camera \
            tests/camera/test_rtsp_parser.c \
            project/example/camera/camera_rtsp_parser.c \
            -o /tmp/camera-rtsp-parser-test
          /tmp/camera-rtsp-parser-test

      - name: Check JPEG motion detector input handling
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iproject/example/camera \
            tests/camera/test_motion.c \
            project/example/camera/camera_motion.c \
            -o /tmp/camera-motion-test
          /tmp/camera-motion-test

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 8-2019-q3

      - name: Configure XR872 build
        shell: bash
        run: |
          printf '%s\n' \
            '__CONFIG_CHIP_TYPE ?= xr872' \
            '__CONFIG_HOSC_TYPE ?= 40' > .config
          chmod +x tools/mkimage

      - name: Build flash image
        shell: bash
        run: |
          make -C project/example/camera/gcc \
            CC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")" image

      - name: Build OTA image
        shell: bash
        run: |
          make -C project/example/camera/gcc \
            CC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")" image_xz

      - name: Check critical code placement
        shell: bash
        run: |
          python3 tools/camera/check_symbol_placement.py \
            --elf project/example/camera/gcc/camera.axf \
            --require-sram camera_http_flash_info \
            --require-sram camera_http_ota \
            --require-xip camera_http_start

      - name: Check 1 MiB flash budget
        shell: bash
        run: |
          mkdir -p dist
          python3 tools/camera/check_image_budget.py \
            --config project/example/camera/image/xr872/image_auto_cal.cfg \
            --image-dir project/example/camera/image/xr872 \
            | tee dist/image-budget.txt
          {
            echo '```text'
            cat dist/image-budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package flash image
        shell: bash
        run: |
          version="$(sed -n 's/^#define CAMERA_VERSION "\([^"]*\)"/\1/p' \
            project/example/camera/camera_version.h)"
          test -n "$version"
          mkdir -p dist
          cp project/example/camera/image/xr872/xr_system.img \
            "dist/camera-xr872-v${version}.img"
          cp project/example/camera/image/xr872/xr_system_img_xz.img \
            "dist/camera-xr872-v${version}-ota.img"
          arm-none-eabi-size project/example/camera/gcc/camera.axf \
            | tee dist/size.txt
          arm-none-eabi-size -A project/example/camera/gcc/camera.axf \
            > dist/sections.txt
          arm-none-eabi-nm -S --size-sort --radix=d \
            project/example/camera/gcc/camera.axf > dist/symbols.txt
          gzip -9 -c project/example/camera/gcc/camera.map \
            > dist/camera.map.gz
          sha256sum dist/*.img > dist/SHA256SUMS
          echo "CAMERA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: camera-xr872-v${{ env.CAMERA_VERSION }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
